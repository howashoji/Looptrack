{{define "totp.html"}}{{template "head" (headData .Lang (T .Lang "server.web.totp.title"))}}
<main class="card">
  <h1>{{T .Lang "server.web.totp.title"}}</h1>
  <p>{{T .Lang "server.web.totp.intro"}}</p>
  {{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
  <form method="post" action="{{base}}/login/totp">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>{{T .Lang "server.web.totp.code"}}<input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" autocomplete="one-time-code" required autofocus></label>
    <button type="submit">{{T .Lang "server.web.totp.submit"}}</button>
  </form>
</main>
{{template "foot"}}{{end}}
